<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Documents | College Admission</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow mx-auto" style="max-width: 600px">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Upload Admission Documents</h3>
        </div>

        <div class="card-body">
          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %} {% if form.errors %}
            <div class="alert alert-danger">{{ form.errors }}</div>
            {% endif %}

            <div class="mb-3">
              <label class="form-label">Admission Application</label>
              {{ form.application }}
            </div>

            <div class="mb-3">
              <label class="form-label">Document Type</label>
              {{ form.document_type }}
            </div>

            <div class="mb-3">
              <label class="form-label">Choose Document</label>
              {{ form.document }}
              <small class="text-muted">
                Select the document file you want to upload.
              </small>
            </div>

            <button type="submit" class="btn btn-primary">
              Upload Document
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
              Back to Dashboard
            </a>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
