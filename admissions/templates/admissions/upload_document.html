<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Upload Student Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f1f5f9;
        font-family: Arial, sans-serif;
      }

      .upload-container {
        max-width: 650px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
        font-weight: bold;
      }

      .form-label {
        font-weight: 600;
        color: #334155;
      }

      .btn-primary {
        background: #4f46e5;
        border: none;
      }

      .btn-primary:hover {
        background: #3730a3;
      }

      .errorlist {
        color: #dc2626;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="upload-container">
        <h2>Upload Student Document</h2>

        {% if messages %} {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %} {% endif %}

        <form
          method="POST"
          enctype="multipart/form-data"
          action="{% url 'upload_document' %}"
        >
          {% csrf_token %} {% if form.errors %}
          <div class="alert alert-danger">
            Please correct the errors below. {{ form.errors }}
          </div>
          {% endif %}

          <!-- Student Name -->
          <div class="mb-3">
            <label for="student_name" class="form-label"> Student Name </label>

            <input
              type="text"
              id="student_name"
              name="student_name"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label"> Email Address </label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Document Type -->
          <div class="mb-3">
            <label for="document_type" class="form-label">
              Document Type
            </label>

            <select
              id="document_type"
              name="document_type"
              class="form-select"
              required
            >
              <option value="">Select Document Type</option>
              <option value="Aadhaar Card">Aadhaar Card</option>
              <option value="10th Marksheet">10th Marksheet</option>
              <option value="12th Marksheet">12th Marksheet</option>
              <option value="Leaving Certificate">Leaving Certificate</option>
              <option value="Caste Certificate">Caste Certificate</option>
            </select>
          </div>

          <!-- Upload File -->
          <div class="mb-4">
            <label for="document_file" class="form-label">
              Choose Document
            </label>

            <input
              type="file"
              id="document_file"
              name="document_file"
              class="form-control"
              accept=".pdf,.jpg,.jpeg,.png"
              required
            />

            <small class="text-muted">
              Accepted formats: PDF, JPG, JPEG, PNG.
            </small>
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">
              Upload Document
            </button>

            <a href="{% url 'dashboard' %}" class="btn btn-secondary flex-fill">
              Back to Dashboard
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
