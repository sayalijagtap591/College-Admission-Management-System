<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for Admission | College Admission Portal</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }

      .navbar {
        background: #172554;
        color: white;
        padding: 18px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .navbar h2 {
        margin: 0;
        font-size: 22px;
      }

      .nav-links {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
      }

      .navbar a {
        color: white;
        text-decoration: none;
        font-size: 15px;
      }

      .navbar a:hover {
        color: #93c5fd;
      }

      .container {
        width: calc(100% - 32px);
        max-width: 750px;
        margin: 40px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        color: #172554;
        margin-top: 0;
        margin-bottom: 12px;
      }

      .subtitle {
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      .message {
        background: #dcfce7;
        color: #166534;
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 15px;
        line-height: 1.5;
      }

      .errorlist {
        color: #dc2626;
        padding-left: 20px;
        margin-top: 6px;
      }

      form p {
        margin-bottom: 18px;
      }

      form label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      form input,
      form select,
      form textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
        background: white;
      }

      form input:focus,
      form select:focus,
      form textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #2563eb;
      }

      form textarea {
        min-height: 100px;
        resize: vertical;
      }

      .helptext {
        display: block;
        margin-top: 5px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #2563eb;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .navbar {
          padding: 16px;
          flex-direction: column;
          align-items: flex-start;
        }

        .nav-links {
          gap: 14px;
        }

        .container {
          margin: 20px auto;
          padding: 20px;
        }

        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <h2>College Admission Portal</h2>
      <div class="nav-links">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'student_profile' %}">My Profile</a>
        <a href="{% url 'student_logout' %}">Logout</a>
      </div>
    </nav>

    <main class="container">
      <h1>Apply for Admission</h1>

      <p class="subtitle">
        Complete the application form to apply for your preferred course.
      </p>

      {% if messages %} {% for message in messages %}
      <div class="message" role="status">{{ message }}</div>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %} {{ form.as_p }}

        <button type="submit">Submit Admission Application</button>
      </form>

      <a class="back-link" href="{% url 'dashboard' %}">
        &larr; Back to Dashboard
      </a>
    </main>
  </body>
</html>
